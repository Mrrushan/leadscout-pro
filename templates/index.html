<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadScout Pro — AI Client & Outreach Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <!-- Navbar -->
    <nav class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <span class="bg-indigo-600 text-white font-bold px-2.5 py-1 rounded-lg text-sm">LS</span>
                <h1 class="text-xl font-bold tracking-tight">LeadScout <span class="text-indigo-400">Pro</span></h1>
            </div>
            <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full">
                ● Live Multi-Source Scanner
            </span>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        
        <!-- Search & Setup Box -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl mb-8">
            <h2 class="text-lg font-semibold mb-1">Find Live Client Leads & Generate Custom Pitches</h2>
            <p class="text-slate-400 text-sm mb-5">Enter your service or niche below. Our engine scans live hiring posts and writes tailored outreach messages for every lead.</p>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1.5">Skill / Service / Niche *</label>
                    <input id="keyword" type="text" placeholder="e.g. Logo Design, Interior Designer" 
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1.5">Target Location (Optional)</label>
                    <input id="location" type="text" placeholder="e.g. USA, UK, Delhi, Remote" 
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1.5">Your Portfolio Link or Contact</label>
                    <input id="portfolio" type="text" placeholder="e.g. behance.net/yourwork" 
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div class="flex items-end">
                    <button onclick="findLeads()" id="searchBtn"
                        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 px-6 rounded-xl transition cursor-pointer">
                        Hunt Live Leads
                    </button>
                </div>
            </div>
        </div>

        <!-- Loader -->
        <div id="loader" class="hidden text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent mb-3"></div>
            <p class="text-slate-400 text-sm">Scanning live sources and crafting personalized outreach pitches...</p>
        </div>

        <!-- Results Container -->
        <div id="results" class="space-y-4"></div>

    </main>

    <script>
        async function findLeads() {
            const keyword = document.getElementById('keyword').value.trim();
            const location = document.getElementById('location').value.trim();
            const portfolio = document.getElementById('portfolio').value.trim() || "Available upon request";
            const btn = document.getElementById('searchBtn');
            const loader = document.getElementById('loader');
            const resultsDiv = document.getElementById('results');

            if (!keyword) return alert("Please enter a skill, service, or keyword first.");

            btn.disabled = true;
            btn.innerText = "Scanning...";
            loader.classList.remove('hidden');
            resultsDiv.innerHTML = "";

            try {
                const res = await fetch('/api/hunt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keyword, location, portfolio })
                });
                const data = await res.json();

                loader.classList.add('hidden');
                btn.disabled = false;
                btn.innerText = "Hunt Live Leads";

                if (!data.leads || data.leads.length === 0) {
                    resultsDiv.innerHTML = `<div class="text-center py-10 text-slate-400 bg-slate-900 rounded-xl border border-slate-800">No live hiring leads found for this exact keyword. Try a broader term (e.g., "Graphic Designer", "Web Developer", "Interior Design").</div>`;
                    return;
                }

                data.leads.forEach((lead, idx) => {
                    const card = `
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 hover:border-slate-700 transition">
                            <div class="flex justify-between items-start gap-4 mb-2">
                                <h3 class="font-semibold text-base text-white">${lead.title}</h3>
                                <span class="shrink-0 text-xs font-medium px-2.5 py-1 rounded-md bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                                    ${lead.source}
                                </span>
                            </div>
                            <p class="text-slate-400 text-xs mb-4 leading-relaxed">${lead.description}</p>
                            
                            <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 mb-4">
                                <div class="flex justify-between items-center mb-1.5">
                                    <span class="text-xs font-semibold text-emerald-400">Tailored AI Outreach Pitch</span>
                                    <button onclick="copyPitch('pitch-${idx}', this)" class="text-xs bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded text-slate-200 cursor-pointer">
                                        Copy Pitch
                                    </button>
                                </div>
                                <p id="pitch-${idx}" class="text-sm text-slate-300 whitespace-pre-line">${lead.pitch}</p>
                            </div>

                            <div class="flex justify-end">
                                <a href="${lead.url}" target="_blank" class="text-xs font-semibold bg-white text-slate-950 hover:bg-slate-200 px-4 py-2 rounded-lg transition">
                                    View Original Lead & Apply →
                                </a>
                            </div>
                        </div>
                    `;
                    resultsDiv.innerHTML += card;
                });

            } catch (err) {
                loader.classList.add('hidden');
                btn.disabled = false;
                btn.innerText = "Hunt Live Leads";
                alert("Server connection error. Please try again in a few seconds.");
            }
        }

        function copyPitch(elementId, btn) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text);
            btn.innerText = "Copied!";
            setTimeout(() => btn.innerText = "Copy Pitch", 2000);
        }
    </script>
</body>
</html>
